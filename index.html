<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#x1F3AC; রিল প্লেয়ার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --gold-1: #f4d03f;
    --gold-2: #d4af37;
    --gold-3: #b8860b;
    --obsidian: #0a0a12;
    --surface: #16161f;
    --border: rgba(255,255,255,0.06);
    --text-primary: #f5f3ef;
    --text-secondary: #a8a8b8;
    --text-muted: #6a6a7a;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans Bengali', system-ui, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px 16px 60px;
    background-color: var(--obsidian);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 80, 255, 0.14), transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 100%, rgba(212, 175, 55, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 40% at 10% 100%, rgba(80, 200, 255, 0.05), transparent 60%);
    background-attachment: fixed;
  }

  body::before {
    content:"";
    position: fixed; inset:0; pointer-events:none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    z-index: 0;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }

  header h1 {
    font-family: 'Cormorant Garamond', 'Noto Sans Bengali', serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 600;
    background: linear-gradient(135deg, #f4d03f 0%, #d4af37 40%, #f9e79f 60%, #b8860b 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmerText 6s linear infinite;
    display: inline-block;
  }

  header h1 i {
    -webkit-text-fill-color: initial;
    color: var(--gold-2);
    filter: drop-shadow(0 0 12px rgba(212,175,55,0.6));
    margin-right: 8px;
  }

  @keyframes shimmerText {
    to { background-position: 200% center; }
  }

  header p {
    color: var(--text-secondary);
    font-size: 0.78rem;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  .player-shell {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 9/16;
    max-height: 72vh;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 15px 50px rgba(0,0,0,0.7),
      0 0 0 1px rgba(212,175,55,0.15),
      0 0 60px rgba(212,175,55,0.08);
    margin: 0 auto;
    transition: all 0.3s ease;
  }

  .stage.fs-mode {
    position: fixed;
    inset: 0;
    z-index: 9999;
    border-radius: 0;
    max-height: 100vh;
    aspect-ratio: auto;
    width: 100vw;
    height: 100vh;
    margin: 0;
  }

  .video-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fb-video,
  .fb-video span,
  .fb-video iframe {
    width: 100% !important;
    height: 100% !important;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 5;
    text-align: center;
    padding: 20px;
  }

  .overlay-start {
    background:
      radial-gradient(circle at 50% 35%, rgba(212,175,55,0.2), transparent 60%),
      linear-gradient(155deg, #0d0d18, #08080d);
    cursor: pointer;
  }

  .start-btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 20px 48px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: #1a1005;
    border: none;
    border-radius: 50px;
    font-family: 'Noto Sans Bengali', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow:
      0 0 50px rgba(212,175,55,0.5),
      0 10px 30px rgba(0,0,0,0.5);
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    z-index: 1;
  }

  .start-btn i { font-size: 1.3rem; }

  .start-btn::before {
    content:"";
    position: absolute;
    inset: 0;
    border-radius: 50px;
    border: 2px solid rgba(212,175,55,0.5);
    animation: pulseRing 2s ease-out infinite;
  }

  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .start-btn:hover {
    transform: scale(1.05);
    box-shadow:
      0 0 80px rgba(212,175,55,0.8),
      0 10px 30px rgba(0,0,0,0.6);
  }

  .start-hint {
    color: var(--text-secondary);
    font-size: 0.82rem;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .start-hint i { color: var(--gold-2); }

  .overlay-loading {
    background: rgba(8,8,13,0.85);
    backdrop-filter: blur(8px);
    z-index: 6;
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(212,175,55,0.15);
    border-top-color: var(--gold-2);
    border-right-color: var(--gold-1);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    filter: drop-shadow(0 0 12px rgba(212,175,55,0.5));
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay-loading p {
    color: var(--text-secondary);
    font-size: 0.85rem;
    letter-spacing: 0.3px;
  }

  .overlay-error {
    background:
      radial-gradient(circle at 50% 35%, rgba(255,80,80,0.15), transparent 60%),
      rgba(8,8,13,0.95);
    z-index: 6;
  }

  .err-icon {
    font-size: 3rem;
    color: #ff6b6b;
    filter: drop-shadow(0 0 20px rgba(255,100,100,0.4));
  }

  .overlay-error p {
    color: var(--text-secondary);
    font-size: 0.9rem;
    max-width: 280px;
    line-height: 1.6;
  }

  .err-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .err-actions button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 24px;
    border: none;
    font-family: 'Noto Sans Bengali', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .btn-retry {
    background: rgba(212,175,55,0.15);
    border: 1px solid rgba(212,175,55,0.4);
    color: var(--gold-1);
  }

  .btn-retry:hover { background: rgba(212,175,55,0.3); }

  .btn-skip {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: #1a1005;
  }

  .btn-skip:hover { transform: scale(1.05); }

  .overlay-tap {
    background: rgba(8,8,13,0.78);
    backdrop-filter: blur(6px);
    z-index: 7;
    cursor: pointer;
  }

  .tap-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 26px 44px;
    background: linear-gradient(135deg, rgba(212,175,55,0.28), rgba(212,175,55,0.08));
    border: 2px solid var(--gold-2);
    border-radius: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: tapPulse 1.6s ease-in-out infinite;
  }

  .tap-btn:hover {
    background: rgba(212,175,55,0.38);
    transform: scale(1.05);
  }

  @keyframes tapPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(212,175,55,0.3); }
    50% { transform: scale(1.03); box-shadow: 0 0 50px rgba(212,175,55,0.55); }
  }

  .tap-icon {
    font-size: 3rem;
    color: var(--gold-1);
    filter: drop-shadow(0 0 20px rgba(212,175,55,0.6));
  }

  .tap-text {
    color: var(--gold-1);
    font-family: 'Noto Sans Bengali', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.4px;
  }

  .control-bar {
    margin-top: 14px;
    padding: 14px 18px;
    background: linear-gradient(155deg, rgba(30,30,44,0.92), rgba(16,16,24,0.96));
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow:
      0 8px 30px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold-1), var(--gold-2));
    border-radius: 4px;
    transition: width 0.5s linear;
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ctrl-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.05);
    color: var(--text-primary);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .ctrl-btn i { pointer-events: none; }

  .ctrl-btn:hover:not(:disabled) {
    background: rgba(212,175,55,0.18);
    color: var(--gold-1);
    transform: scale(1.08);
  }

  .ctrl-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  .ctrl-btn.primary {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: #1a1005;
    font-size: 1.25rem;
    box-shadow: 0 4px 20px rgba(212,175,55,0.4);
  }

  .ctrl-btn.primary:hover {
    background: linear-gradient(135deg, #fff8dc, var(--gold-1));
    color: #1a1005;
    transform: scale(1.1);
    box-shadow: 0 6px 30px rgba(212,175,55,0.65);
  }

  .volume-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
    margin-left: 4px;
  }

  .volume-slider {
    flex: 1;
    min-width: 40px;
    height: 4px;
    accent-color: var(--gold-2);
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold-1);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(212,175,55,0.6);
  }

  .volume-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold-1);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 8px rgba(212,175,55,0.6);
  }

  .time-display {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.3px;
    margin-left: 6px;
    white-space: nowrap;
  }

  .info-panel {
    margin-top: 14px;
    padding: 16px 20px;
    background: linear-gradient(155deg, rgba(30,30,44,0.85), rgba(16,16,24,0.92));
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .reel-num {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: #1a1005;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .reel-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }

  .reel-meta span {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .reel-meta i { color: var(--gold-2); }

  .playlist-section {
    max-width: 900px;
    margin: 32px auto 0;
    position: relative;
    z-index: 1;
  }

  .playlist-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .playlist-header h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .playlist-header h2 i { color: var(--gold-2); }

  .playlist-header::after {
    content:"";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(212,175,55,0.3), transparent);
  }

  .playlist {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    padding: 8px;
    background: linear-gradient(155deg, rgba(30,30,44,0.7), rgba(16,16,24,0.85));
    border-radius: 16px;
    border: 1px solid var(--border);
    scrollbar-width: thin;
    scrollbar-color: rgba(212,175,55,0.3) transparent;
  }

  .playlist::-webkit-scrollbar { width: 6px; }
  .playlist::-webkit-scrollbar-track { background: transparent; }
  .playlist::-webkit-scrollbar-thumb {
    background: rgba(212,175,55,0.3);
    border-radius: 3px;
  }

  .playlist-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    color: var(--text-secondary);
    font-family: 'Noto Sans Bengali', sans-serif;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    min-height: 56px;
  }

  .playlist-item:hover {
    background: rgba(212,175,55,0.1);
    border-color: rgba(212,175,55,0.3);
    color: var(--gold-1);
    transform: translateY(-2px);
  }

  .playlist-item.active {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: #1a1005;
    border-color: var(--gold-1);
    box-shadow: 0 4px 16px rgba(212,175,55,0.4);
    font-weight: 700;
  }

  .pl-num {
    font-weight: 700;
    font-size: 0.8rem;
  }

  .pl-date {
    font-size: 0.62rem;
    opacity: 0.75;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.72rem;
    margin-top: 40px;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
  }

  footer i { color: var(--gold-3); }

  @media (max-width: 480px) {
    body { padding: 16px 10px 40px; }
    .stage { max-height: 65vh; border-radius: 14px; }
    .control-bar { padding: 10px 12px; }
    .ctrl-btn { width: 38px; height: 38px; font-size: 0.9rem; }
    .ctrl-btn.primary { width: 48px; height: 48px; font-size: 1.1rem; }
    .volume-slider { display: none; }
    .time-display { display: none; }
    .info-panel { padding: 12px 16px; }
    .reel-meta { gap: 10px; font-size: 0.75rem; }
    .playlist { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); max-height: 250px; }
    .playlist-item { font-size: 0.62rem; min-height: 50px; }
  }
</style>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-film"></i>রিল প্লেয়ার</h1>
  <p id="status">শুরু করতে প্লে বাটনে ক্লিক করুন</p>
</header>

<div class="player-shell">
  <div class="stage" id="stage">
    <div class="video-wrap" id="videoWrap"></div>

    <div class="overlay overlay-start" id="overlayStart">
      <button class="start-btn" id="startBtn">
        <i class="fa-solid fa-play"></i>
        <span>শুরু করুন</span>
      </button>
      <div class="start-hint">
        <i class="fa-solid fa-volume-high"></i>
        <span>সাউন্ড সহ প্লে করুন</span>
      </div>
    </div>

    <div class="overlay overlay-loading" id="overlayLoading" style="display:none">
      <div class="spinner"></div>
      <p>ভিডিও লোড হচ্ছে…</p>
    </div>

    <div class="overlay overlay-tap" id="overlayTap" style="display:none">
      <div class="tap-btn" id="tapBtn">
        <div class="tap-icon"><i class="fa-solid fa-hand-pointer"></i></div>
        <div class="tap-text">ট্যাপ করে ভিডিও চালু করুন</div>
      </div>
    </div>

    <div class="overlay overlay-error" id="overlayError" style="display:none">
      <div class="err-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <p>ভিডিওটি লোড হচ্ছে না।<br>অন্য ভিডিওতে যাওয়া যাবে</p>
      <div class="err-actions">
        <button class="btn-retry" id="retryBtn">
          <i class="fa-solid fa-rotate-right"></i> আবার
        </button>
        <button class="btn-skip" id="skipBtn">
          <i class="fa-solid fa-forward"></i> পরের ভিডিও
        </button>
      </div>
    </div>
  </div>

  <div class="control-bar">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="control-row">
      <button class="ctrl-btn" id="prevBtn" title="আগের"><i class="fa-solid fa-backward-step"></i></button>
      <button class="ctrl-btn primary" id="playBtn" title="প্লে/পজ"><i class="fa-solid fa-play"></i></button>
      <button class="ctrl-btn" id="nextBtn" title="পরের"><i class="fa-solid fa-forward-step"></i></button>
      <div class="volume-group">
        <button class="ctrl-btn" id="muteBtn" title="মিউট"><i class="fa-solid fa-volume-high"></i></button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
      </div>
      <button class="ctrl-btn" id="fsBtn" title="ফুলস্ক্রিন"><i class="fa-solid fa-expand"></i></button>
      <span class="time-display" id="timeDisplay">০:০০</span>
    </div>
  </div>

  <div class="info-panel">
    <span class="reel-num"><i class="fa-solid fa-hashtag"></i> রিল <span id="reelNum">—</span></span>
    <div class="reel-meta">
      <span><i class="fa-solid fa-calendar-days"></i> <span id="reelDate">—</span></span>
      <span><i class="fa-solid fa-calendar-week"></i> <span id="reelDay">—</span></span>
      <span><i class="fa-solid fa-clock"></i> <span id="reelTime">—</span></span>
    </div>
  </div>
</div>

<div class="playlist-section">
  <div class="playlist-header">
    <h2><i class="fa-solid fa-list"></i> প্লেলিস্ট (<span id="plCount">০</span>)</h2>
  </div>
  <div class="playlist" id="playlist"></div>
</div>

<footer><i class="fa-regular fa-copyright"></i> 2026 — Premium Reel Player</footer>

<div id="fb-root"></div>

<script>
  var STATE = {
    currentIndex: -1,
    currentLoad: 0,
    fbInstance: null,
    isPlaying: false,
    isMuted: false,
    volume: 1,
    started: false,
    errorTimer: null,
    progressTimer: null,
    autoplayTimers: [],
    fsMode: false
  };

  window.fbAsyncInit = function() {
    FB.init({ xfbml: false, version: 'v19.0' });
    window.FB_READY = true;
    console.log("\u2705 FB SDK ready");

    FB.Event.subscribe('xfbml.ready', function(msg) {
      if (msg.type !== 'video' || !msg.instance) return;

      var expectedId = 'fbvid-' + STATE.currentLoad;
      if (msg.id !== expectedId) {
        console.log('Stale ready ignored:', msg.id);
        return;
      }

      console.log("\u2705 Video ready:", msg.id);
      STATE.fbInstance = msg.instance;

      msg.instance.subscribe('startedPlaying', function() {
        if (msg.id !== 'fbvid-' + STATE.currentLoad) return;
        STATE.isPlaying = true;
        updatePlayBtn();
        hideAllOverlays();
        cancelAutoplayTimers();
      });

      msg.instance.subscribe('paused', function() {
        if (msg.id !== 'fbvid-' + STATE.currentLoad) return;
        STATE.isPlaying = false;
        updatePlayBtn();
      });

      msg.instance.subscribe('finishedPlaying', function() {
        if (msg.id !== 'fbvid-' + STATE.currentLoad) return;
        console.log("\u2705 Finished \u2014 auto next");
        goNext();
      });

      msg.instance.subscribe('error', function(e) {
        if (msg.id !== 'fbvid-' + STATE.currentLoad) return;
        console.warn("\u274C Video error:", e);
        showError();
      });

      try {
        msg.instance.setVolume(STATE.volume);
      } catch(e) {}

      tryAutoplay(msg.instance, STATE.currentLoad);
      startProgressPolling();
    });

    document.getElementById('status').textContent = "প্লেয়ার প্রস্তুত";
  };

  setTimeout(function() {
    if (!window.FB_READY) {
      console.error("\u274C FB SDK not loaded");
      document.getElementById('status').textContent =
        "\u26A0\uFE0F Facebook SDK লোড হয়নি";
    }
  }, 10000);
</script>
<script async defer crossorigin="anonymous"
  src="https://connect.facebook.net/en_US/sdk.js"></script>

<script src="links.js"></script>

<script>
/* ============ বাংলা হেল্পার ============ */
var BN_M = {
  Jan:"জানুয়ারি", Feb:"ফেব্রুয়ারি", Mar:"মার্চ", Apr:"এপ্রিল",
  May:"মে", Jun:"জুন", Jul:"জুলাই", Aug:"আগস্ট",
  Sep:"সেপ্টেম্বর", Oct:"অক্টোবর", Nov:"নভেম্বর", Dec:"ডিসেম্বর"
};
var BN_M_SHORT = {
  Jan:"জানু", Feb:"ফেব", Mar:"মার্চ", Apr:"এপ্রি",
  May:"মে", Jun:"জুন", Jul:"জুলাই", Aug:"আগ",
  Sep:"সেপ", Oct:"অক্ট", Nov:"নভে", Dec:"ডিসে"
};
var BN_D = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
var BN_DIGITS = "\u09E6\u09E7\u09E8\u09E9\u09EA\u09EB\u09EC\u09ED\u09EE\u09EF";

function toBn(n) {
  return String(n).replace(/\d/g, function(d){ return BN_DIGITS[d]; });
}

function parseDate(s) {
  var m = s.match(/([A-Za-z]+)\s+(\d+),\s+(\d+)/);
  if (!m) return {dayBn:"",monthBn:s,monthShort:s,yearBn:"",dayOfWeek:""};
  var mo=m[1], dy=m[2], yr=m[3];
  var d = new Date(mo+" "+dy+", "+yr+" 12:00:00");
  return {
    monthBn: BN_M[mo]||mo,
    monthShort: BN_M_SHORT[mo]||mo,
    dayBn: toBn(dy),
    yearBn: toBn(yr),
    dayOfWeek: BN_D[d.getDay()]||""
  };
}

function parseTime(s) {
  var m = s.match(/(\d+):(\d+):(\d+)\s*(am|pm)/i);
  if (!m) return s;
  return toBn(m[1])+":"+toBn(m[2])+":"+toBn(m[3])+" "+m[4].toLowerCase();
}

function formatTime(sec) {
  sec = Math.floor(sec || 0);
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return toBn(m) + ":" + (s < 10 ? "\u09E6" : "") + toBn(s);
}

/* ============ Aggressive Autoplay ============ */
function tryPlay(instance, loadId) {
  if (loadId !== STATE.currentLoad) return;
  try {
    instance.play();
    setTimeout(function() {
      if (loadId !== STATE.currentLoad) return;
      try { instance.unmute(); } catch(e) {}
    }, 200);
  } catch(e) {
    console.warn("play() failed:", e);
  }
}

function tryAutoplay(instance, loadId) {
  cancelAutoplayTimers();

  // Immediately
  tryPlay(instance, loadId);

  // Retry at increasing intervals
  var delays = [300, 800, 1500, 2500, 3500];
  delays.forEach(function(delay) {
    var t = setTimeout(function() {
      if (loadId !== STATE.currentLoad) return;
      if (STATE.isPlaying) return;
      console.log("\u25B6\uFE0F play() retry @" + delay + "ms");
      tryPlay(instance, loadId);
    }, delay);
    STATE.autoplayTimers.push(t);
  });

  // If still not playing after 4s, show tap overlay
  var tapTimer = setTimeout(function() {
    if (loadId !== STATE.currentLoad) return;
    if (STATE.isPlaying) return;
    console.warn("Autoplay failed, showing tap overlay");
    showTapOverlay();
  }, 4000);
  STATE.autoplayTimers.push(tapTimer);

  // Auto-skip after 10s if still not playing
  var skipTimer = setTimeout(function() {
    if (loadId !== STATE.currentLoad) return;
    if (STATE.isPlaying) return;
    console.warn("\u23ED\uFE0F Auto-skip: video didn't play");
    goNext();
  }, 10000);
  STATE.autoplayTimers.push(skipTimer);
}

function cancelAutoplayTimers() {
  STATE.autoplayTimers.forEach(function(t) { clearTimeout(t); });
  STATE.autoplayTimers = [];
}

/* ============ UI আপডেট ============ */
function updateInfo(index) {
  var reel = reels[index];
  if (!reel) return;
  var d = parseDate(reel.d);
  var t = parseTime(reel.t);
  document.getElementById('reelNum').textContent = toBn(index + 1);
  document.getElementById('reelDate').textContent = d.dayBn + ' ' + d.monthBn + ' ' + d.yearBn;
  document.getElementById('reelDay').textContent = d.dayOfWeek;
  document.getElementById('reelTime').textContent = t;
}

function updatePlayBtn() {
  var icon = document.querySelector('#playBtn i');
  if (STATE.isPlaying) {
    icon.className = 'fa-solid fa-pause';
  } else {
    icon.className = 'fa-solid fa-play';
  }
}

function updateMuteBtn() {
  var icon = document.querySelector('#muteBtn i');
  if (STATE.isMuted || STATE.volume === 0) {
    icon.className = 'fa-solid fa-volume-xmark';
  } else if (STATE.volume < 0.5) {
    icon.className = 'fa-solid fa-volume-low';
  } else {
    icon.className = 'fa-solid fa-volume-high';
  }
}

function updateNavButtons() {
  document.getElementById('prevBtn').disabled = STATE.currentIndex <= 0;
  document.getElementById('nextBtn').disabled = STATE.currentIndex >= reels.length - 1;
}

function updatePlaylistActive(index) {
  document.querySelectorAll('.playlist-item').forEach(function(el, i) {
    el.classList.toggle('active', i === index);
  });
  var active = document.querySelector('.playlist-item.active');
  if (active) {
    active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

/* ============ Overlay helpers ============ */
function hideAllOverlays() {
  document.getElementById('overlayStart').style.display = 'none';
  document.getElementById('overlayLoading').style.display = 'none';
  document.getElementById('overlayError').style.display = 'none';
  document.getElementById('overlayTap').style.display = 'none';
}

function showLoading() {
  hideAllOverlays();
  document.getElementById('overlayLoading').style.display = 'flex';
}

function showError() {
  hideAllOverlays();
  document.getElementById('overlayError').style.display = 'flex';
  document.getElementById('status').textContent =
    "সমস্যা — অটো-স্কিপ চালু";

  if (STATE.errorTimer) clearTimeout(STATE.errorTimer);
  STATE.errorTimer = setTimeout(function() {
    goNext();
  }, 5000);
}

function showTapOverlay() {
  document.getElementById('overlayLoading').style.display = 'none';
  document.getElementById('overlayError').style.display = 'none';
  document.getElementById('overlayTap').style.display = 'flex';
}

function hideTapOverlay() {
  document.getElementById('overlayTap').style.display = 'none';
}

function hideError() {
  document.getElementById('overlayError').style.display = 'none';
  if (STATE.errorTimer) {
    clearTimeout(STATE.errorTimer);
    STATE.errorTimer = null;
  }
}

/* ============ প্রোগ্রেস পোলিং ============ */
function startProgressPolling() {
  if (STATE.progressTimer) clearInterval(STATE.progressTimer);
  STATE.progressTimer = setInterval(function() {
    if (!STATE.fbInstance) return;
    try {
      var pos = STATE.fbInstance.getCurrentPosition() || 0;
      var dur = STATE.fbInstance.getDuration() || 0;
      if (dur > 0) {
        var pct = Math.min(100, (pos / dur) * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('timeDisplay').textContent =
          formatTime(pos) + ' / ' + formatTime(dur);
      }
    } catch(e) {}
  }, 1000);
}

/* ============ নেভিগেশন ============ */
function goNext() {
  if (STATE.currentIndex < reels.length - 1) {
    loadVideo(STATE.currentIndex + 1);
  } else {
    loadVideo(0);
  }
}

function goPrev() {
  if (STATE.currentIndex > 0) {
    loadVideo(STATE.currentIndex - 1);
  }
}

/* ============ ভিডিও লোড ============ */
function loadVideo(index) {
  if (index < 0 || index >= reels.length) return;

  cancelAutoplayTimers();
  if (STATE.errorTimer) { clearTimeout(STATE.errorTimer); STATE.errorTimer = null; }

  STATE.currentIndex = index;
  STATE.currentLoad++;
  var thisLoad = STATE.currentLoad;
  STATE.isPlaying = false;
  STATE.fbInstance = null;

  showLoading();
  updateInfo(index);
  updatePlaylistActive(index);
  updateNavButtons();
  updatePlayBtn();

  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timeDisplay').textContent = "০:০০";
  document.getElementById('status').textContent =
    "রিল " + toBn(index + 1) + " / " + toBn(reels.length);

  var wrap = document.getElementById('videoWrap');
  wrap.innerHTML = '';

  var wrapper = document.createElement('div');
  wrapper.id = 'fbvid-' + thisLoad;
  wrapper.className = 'fb-video';
  wrapper.setAttribute('data-href', reels[index].u);
  wrapper.setAttribute('data-width', 'auto');
  wrapper.setAttribute('data-autoplay', 'true');
  wrapper.setAttribute('data-allowfullscreen', 'true');
  wrapper.setAttribute('data-show-captions', 'false');

  wrap.appendChild(wrapper);

  function doParse() {
    if (thisLoad !== STATE.currentLoad) return;
    try {
      FB.XFBML.parse(wrap);
    } catch(e) {
      console.warn('Parse error:', e);
      showError();
    }
  }

  if (window.FB && window.FB_READY) {
    doParse();
  } else {
    var wait = setInterval(function() {
      if (window.FB_READY) {
        clearInterval(wait);
        doParse();
      }
    }, 200);
    setTimeout(function() {
      clearInterval(wait);
      if (!window.FB_READY && thisLoad === STATE.currentLoad) {
        showError();
      }
    }, 12000);
  }

  setTimeout(function() {
    if (thisLoad === STATE.currentLoad && !STATE.fbInstance) {
      console.warn('Ready timeout');
      showError();
    }
  }, 12000);
}

/* ============ কন্ট্রোল বাটন ============ */
document.getElementById('startBtn').addEventListener('click', function() {
  STATE.started = true;
  loadVideo(0);
});

document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);

document.getElementById('playBtn').addEventListener('click', function() {
  if (!STATE.fbInstance) return;
  try {
    if (STATE.isPlaying) {
      STATE.fbInstance.pause();
      console.log("\u23F8\uFE0F pause()");
    } else {
      STATE.fbInstance.play();
      STATE.fbInstance.unmute();
      hideTapOverlay();
      console.log("\u25B6\uFE0F play() from button");
    }
  } catch(e) {
    console.warn('Play toggle failed:', e);
    try { STATE.fbInstance.play(); } catch(e2) {}
  }
});

document.getElementById('muteBtn').addEventListener('click', function() {
  STATE.isMuted = !STATE.isMuted;
  if (STATE.fbInstance) {
    try {
      if (STATE.isMuted) STATE.fbInstance.mute();
      else STATE.fbInstance.unmute();
    } catch(e) {}
  }
  updateMuteBtn();
});

document.getElementById('volumeSlider').addEventListener('input', function() {
  STATE.volume = this.value / 100;
  if (STATE.volume > 0 && STATE.isMuted) {
    STATE.isMuted = false;
    if (STATE.fbInstance) {
      try { STATE.fbInstance.unmute(); } catch(e) {}
    }
  }
  if (STATE.fbInstance) {
    try { STATE.fbInstance.setVolume(STATE.volume); } catch(e) {}
  }
  updateMuteBtn();
});

document.getElementById('fsBtn').addEventListener('click', function() {
  var stage = document.getElementById('stage');
  var icon = document.querySelector('#fsBtn i');
  if (STATE.fsMode) {
    STATE.fsMode = false;
    stage.classList.remove('fs-mode');
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function(){});
    }
    icon.className = 'fa-solid fa-expand';
  } else {
    STATE.fsMode = true;
    stage.classList.add('fs-mode');
    if (stage.requestFullscreen) {
      stage.requestFullscreen().catch(function() {
        // CSS fullscreen still active
      });
    }
    icon.className = 'fa-solid fa-compress';
  }
});

document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement && STATE.fsMode) {
    STATE.fsMode = false;
    document.getElementById('stage').classList.remove('fs-mode');
    document.querySelector('#fsBtn i').className = 'fa-solid fa-expand';
  }
});

document.getElementById('retryBtn').addEventListener('click', function() {
  var idx = STATE.currentIndex;
  hideError();
  loadVideo(idx);
});

document.getElementById('skipBtn').addEventListener('click', function() {
  hideError();
  goNext();
});

document.getElementById('tapBtn').addEventListener('click', function() {
  if (!STATE.fbInstance) return;
  try {
    STATE.fbInstance.play();
    STATE.fbInstance.unmute();
    hideTapOverlay();
    console.log("\u2705 Tap play triggered");
  } catch(e) {
    console.warn('Tap play failed:', e);
  }
});

/* ============ Global Click to Play (capture) ============ */
document.getElementById('stage').addEventListener('click', function(e) {
  if (e.target.closest('.overlay-start, .overlay-error, .overlay-tap, button, input')) return;
  if (STATE.fbInstance && !STATE.isPlaying) {
    try { STATE.fbInstance.play(); } catch(e) {}
    hideTapOverlay();
  }
}, true);

/* ============ কীবোর্ড ============ */
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key) {
    case ' ': e.preventDefault(); document.getElementById('playBtn').click(); break;
    case 'ArrowLeft': e.preventDefault(); goPrev(); break;
    case 'ArrowRight': e.preventDefault(); goNext(); break;
    case 'm': case 'M': document.getElementById('muteBtn').click(); break;
    case 'f': case 'F': document.getElementById('fsBtn').click(); break;
  }
});

/* ============ প্লেলিস্ট ============ */
function renderPlaylist() {
  var html = '';
  reels.forEach(function(reel, i) {
    var d = parseDate(reel.d);
    html +=
      '<button class="playlist-item" data-index="' + i + '">' +
        '<span class="pl-num">#' + toBn(i + 1) + '</span>' +
        '<span class="pl-date">' + d.dayBn + ' ' + d.monthShort + '</span>' +
      '</button>';
  });
  document.getElementById('playlist').innerHTML = html;
  document.getElementById('plCount').textContent = toBn(reels.length);

  document.getElementById('playlist').addEventListener('click', function(e) {
    var item = e.target.closest('.playlist-item');
    if (item) {
      var idx = parseInt(item.dataset.index, 10);
      if (!isNaN(idx)) {
        STATE.started = true;
        loadVideo(idx);
      }
    }
  });
}

/* ============ শুরু ============ */
renderPlaylist();
</script>
